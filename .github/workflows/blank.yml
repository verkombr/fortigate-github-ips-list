name: Generate GitHub Actions IP List

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

# Permissão de escrita habilitada para salvar o txt
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Atualizado para v4 (remove o aviso do Node.js)
      - uses: actions/checkout@v4 
      
      - name: Fetch and Parse GitHub IPs
        run: |
          curl -s https://api.github.com/meta | jq -r '.actions[]' > github_actions_ips.txt
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add github_actions_ips.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update IP list"
          git push
